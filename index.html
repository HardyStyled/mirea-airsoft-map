<head>

<div id="map" aria-label="3D-вид полигона">
  <span id="orbitCenter" aria-hidden="true"></span>
  <svg id="figureGizmo" aria-label="Гизмо фигурки" xmlns="http://www.w3.org/2000/svg"></svg>
</div>
<canvas id="plan" tabindex="0" aria-label="2D-план полигона. В сплите нажатие переносит 3D-камеру. Стрелки или перетаскивание двигают план, плюс, минус или щипок меняют масштаб, Home вписывает полигон"></canvas>
<div id="flyCross" aria-hidden="true"></div>
<!-- FOV — слайдер внутри 3D-вида у правого края (I6): значение видно у трека, сам трек гаснет в покое -->
<div id="fovCtl">
  <b id="fovVal">86°</b>
  <input type="range" id="fovSl" min="30" max="120" value="86" aria-label="Поле зрения 3D-камеры, градусов">
</div>
<div id="miniNav">
<button id="mm" type="button" aria-label="Открыть 3D и план" title="Открыть 3D и план">
  <canvas id="mmc" aria-hidden="true"></canvas>
</button>
<button id="miniToggle" type="button" aria-expanded="true" aria-controls="mm" aria-label="Свернуть мини-карту" title="Свернуть мини-карту"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="mini-hide" d="m15 6-6 6 6 6"/><use class="mini-show" href="#mini-plan-icon"/></svg></button>
</div>
<div id="stick" aria-hidden="true"><div class="knob"></div></div>
<div id="flyBtns">
  <button class="fbtn" id="flyUp" aria-label="Высота вверх">↑</button>
  <button class="fbtn" id="flyDown" aria-label="Высота вниз">↓</button>
  <button class="fbtn" id="flyRun" aria-label="Ускорение ×4" aria-pressed="false" title="Ускорение ×4">×4</button>
</div>
<div id="viewDock">
  <div id="camTools" role="group" aria-label="Режим камеры">
    <button type="button" id="miOrbit" aria-pressed="true" aria-keyshortcuts="V" title="Вращать модель (V)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="9" ry="5" transform="rotate(-32 12 12)"/><circle cx="12" cy="12" r="2"/></svg><span>Орбита</span>
    </button>
    <button type="button" id="miFly" aria-pressed="false" aria-keyshortcuts="F" aria-label="Свободная камера" title="Свободная камера (F), колесо меняет скорость">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 13 18-9-7 17-2.5-7.5L3 13Zm8.5.5L21 4"/></svg><span id="speedTag" hidden><b id="speedValue">6 м/с</b></span><span>Свободная<span class="camera-noun"> камера</span></span>
    </button>
  </div>
  <div id="lensTools" role="group" aria-label="Увеличение камеры">
    <div class="lens-presets" role="group" aria-label="Кратность">
      <button type="button" data-zoom="0.6" aria-pressed="false">0,6×</button>
      <button type="button" data-zoom="1" aria-pressed="true">1×</button>
      <button type="button" data-zoom="2" aria-pressed="false">2×</button>
    </div>
    <div id="lensPanel" hidden>
      <div class="lens-heading"><label for="lensRange">Угол обзора</label><output id="lensDegrees" for="lensRange">86°</output></div>
      <input id="lensRange" type="range" min="30" max="120" value="86" dir="rtl" aria-label="Угол обзора камеры, градусов">
    </div>
    <button type="button" id="lensToggle" aria-label="Точная настройка увеличения, 1×" aria-expanded="false" aria-controls="lensPanel" title="Точная настройка увеличения">⋯</button>
  </div>
</div>
<div class="readout" role="group" aria-label="План и масштаб">
  <div class="plan-actions" role="group" aria-label="Управление планом">
    <button type="button" id="planIn" aria-label="Приблизить план" title="Приблизить план">+</button>
    <button type="button" id="planOut" aria-label="Отдалить план" title="Отдалить план">−</button>
    <button type="button" id="planSize" title="Весь план">
      <span class="to-plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10V4h6m4 0h6v6m0 4v6h-6m-4 0H4v-6"/></svg><span class="plan-label">Весь план</span></span>
      <span class="to-split"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 12h18"/></svg><span class="plan-label">3D + план</span></span>
    </button>
    <button type="button" id="planBack" title="Свернуть план и вернуться к мини-карте"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#mini-plan-icon"/></svg><span class="plan-label">К мини-карте</span></button>
    <button type="button" id="planHomeCompact" aria-label="Вернуть план к центру" title="Вернуть план к центру"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg></button>
  </div>
  <div class="plan-metrics"><span id="roCoord">—, —</span><span class="sbar"><i id="sbarBar"></i><b id="sbarVal">10 м</b></span></div>
</div>
<dialog id="tut" aria-labelledby="tutTitle" hidden>
  <div class="tut-card">
    <header class="tut-head">
      <h2 id="tutTitle">Управление</h2>
      <p class="sub" id="tutSub"></p>
    </header>
    <p id="welcomeWeather" hidden><svg class="sky-icon" hidden aria-hidden="true"><use/></svg><span id="welcomeSummary">Загружаем погоду…</span></p>
    <div class="tut-tabs" id="tutTabs" role="tablist" aria-label="Способ управления" hidden>
      <button type="button" role="tab" id="tutMouseTab" aria-controls="tutMousePanel" aria-selected="true">Мышь и клавиатура</button>
      <button type="button" role="tab" id="tutTouchTab" aria-controls="tutTouchPanel" aria-selected="false" tabindex="-1">Сенсорный экран</button>
    </div>
    <div class="tut-panel" id="tutMousePanel" role="tabpanel" aria-labelledby="tutMouseTab" tabindex="0" hidden></div>
    <div class="tut-panel" id="tutTouchPanel" role="tabpanel" aria-labelledby="tutTouchTab" tabindex="0" hidden></div>
    <div class="tut-foot">
      <span class="hint" id="tutWelcomeHint" hidden>Подсказки есть в «Меню → Управление».</span>
      <button class="btn primary" id="tutOk" type="button">Понятно</button>
      <button class="btn" id="tutPlan" type="button" hidden>Открыть план</button>
    </div>
  </div>
</dialog>
<dialog id="weather" aria-label="Погода">
  <form method="dialog" class="weather-dismiss"><button class="weather-close" aria-label="Закрыть погоду" autofocus>×</button></form>
  <div id="weatherData" hidden>
    <div class="weather-temperature"><span id="weatherTemp"></span><span class="weather-unit"> °C</span></div>
    <div class="weather-condition"><svg class="sky-icon" aria-hidden="true"><use/></svg><span id="weatherCondition"></span></div>
    <div class="weather-wind" id="weatherWind"></div>
  </div>
  <p id="weatherStatus" role="status"></p>
  <button id="weatherRetry" type="button" hidden>Повторить запрос</button>
  <footer>Источник данных — <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a>
    · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a></footer>
</dialog>

    <button id="figureSnap" type="button">Снап</button>

<div id="markerPrompt" hidden><span id="markerInstruction">Выберите место на плане</span><button type="button" id="markerCancel">Отмена</button></div>
<div id="stat" role="status"></div>
<div id="toast" role="status"></div>
