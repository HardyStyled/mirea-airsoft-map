<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mirea-airsoft-map — полигон МИРЭА</title>
<link href="vendor/cesium/Widgets/widgets.css" rel="stylesheet">
<link rel="stylesheet" href="ui.css?v=19">
</head>
<body data-tool="sel" data-camera-mode="orbit">

<div id="map" aria-label="3D-вид полигона"></div>
<canvas id="plan" tabindex="0" aria-label="2D-план полигона. Стрелки или одиночный палец двигают карту, плюс, минус или щипок меняют масштаб, Home вписывает полигон"></canvas>
<div id="speedTag" role="status" hidden>Скорость <b id="speedValue">6 м/с</b></div>
<div id="flyCross" aria-hidden="true"></div>
<!-- FOV — слайдер внутри 3D-вида у правого края (I6): значение видно у трека, сам трек гаснет в покое -->
<div id="fovCtl">
  <b id="fovVal">86°</b>
  <input type="range" id="fovSl" min="30" max="120" value="86" aria-label="Поле зрения 3D-камеры, градусов">
</div>
<div id="mm"><canvas id="mmc" aria-hidden="true"></canvas></div>
<div id="dbg" role="status" aria-hidden="true">
  <div class="fps">FPS <b id="dbgFps">—</b></div>
  <div>канвас <b id="dbgCanvas">—</b></div>
  <div>камера <b id="dbgCam">—</b></div>
  <div><b id="dbgAngles">—</b></div>
  <div>FOV <b id="dbgFov">—</b></div>
</div>
<div id="stick" aria-hidden="true"><div class="knob"></div></div>
<div id="flyBtns">
  <button class="fbtn" id="flyUp" aria-label="Высота вверх">↑</button>
  <button class="fbtn" id="flyDown" aria-label="Высота вниз">↓</button>
  <button class="fbtn" id="flyRun" aria-label="Ускорение" title="Бег ×4">×4</button>
</div>
<div id="stat" role="status"></div>
<div id="chunkStatus" role="status" aria-live="polite" aria-atomic="true" hidden>
  <span class="chunk-spinner" aria-hidden="true"></span><span id="chunkText"></span>
</div>
<aside id="perfNotice" aria-label="Рекомендация по производительности" hidden>
  <button id="perfClose" class="icon-btn" type="button" aria-label="Закрыть рекомендацию" title="Закрыть">
    <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.4"/></svg>
  </button>
  <div id="perfText" role="status" aria-live="polite" aria-atomic="true">
    <h2 id="perfTitle"></h2><p id="perfBody"></p>
  </div>
</aside>

<aside id="insp" aria-label="Информация об объекте" inert>
  <button id="inspClose" class="icon-btn" type="button" aria-label="Закрыть карточку" title="Закрыть">
    <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.4"/></svg>
  </button>
  <h3>Объект <span class="chip" id="oFid"></span><span class="chip" id="oLayer"></span></h3>
  <input type="text" id="fName" aria-label="Название объекта" readonly>
  <div class="meta"><span class="chip" id="oType"></span></div>
  <div class="vt" id="verts"></div>
</aside>

<div class="readout" aria-label="Координаты центра плана и масштаб"><span id="roCoord">—, —</span><span class="sbar"><i id="sbarBar"></i><b id="sbarVal">10 м</b></span></div>
<div id="toast" role="status"></div>

<div id="tut" role="dialog" aria-modal="true" aria-label="Как управлять" hidden>
  <div class="tut-card">
    <h2>Управление</h2>
    <p class="sub" id="tutSub"></p>
    <div class="tut-grid" id="tutGrid"></div>
    <div class="tut-foot">
      <span class="hint">Подсказку можно снова открыть в меню шестерёнки: «Управление»</span>
      <button class="btn primary" id="tutOk" type="button">Понятно</button>
    </div>
  </div>
</div>

<!-- мобильные FAB и контекстные меню (раскладка утверждена превью ai-project/ui-preview/06-mobile.html) -->
<div id="modeMenu" class="menu" role="menu" aria-label="Режим вида">
  <button class="mi" id="mi3d" role="menuitemradio" aria-checked="false">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 21 7.5 12 12 3 7.5 Z"/><path d="M3 12.5 12 17l9-4.5"/><path d="M3 17 12 21.5 21 17"/></svg>
    3D <span class="kbd">1</span> <svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12.5 5 5L20 6.5"/></svg>
  </button>
  <button class="mi on" id="miSplit" role="menuitemradio" aria-checked="true">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M12 4.5v15"/></svg>
    3D + план <span class="kbd">2</span> <svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12.5 5 5L20 6.5"/></svg>
  </button>
  <button class="mi" id="mi2d" role="menuitemradio" aria-checked="false">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 7 6-3 7 3 4-2v12l-6 3-7-3-4 2Z"/><path d="M9.5 4v13M16.5 7v13"/></svg>
    План <span class="kbd">3</span> <svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12.5 5 5L20 6.5"/></svg>
  </button>
</div>
<div id="camMenu" class="menu" role="menu" aria-label="Камера">
  <button class="mi on" id="miOrbit" role="menuitemradio" aria-checked="true">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/><path d="M12 3.5v5M12 15.5v5M3.5 12h5M15.5 12h5" opacity=".55"/></svg>
    Осмотр <span class="kbd">V</span> <svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12.5 5 5L20 6.5"/></svg>
  </button>
  <button class="mi" id="miFly" role="menuitemradio" aria-checked="false">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 14.5 21.5 5l-6 15-2.5-6Z"/></svg>
    Полёт <span class="kbd">F</span> <svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12.5 5 5L20 6.5"/></svg>
  </button>
  <div class="msep"></div>
  <button class="mi" id="miHome">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9h14v-9"/></svg>
    Исходный вид <span class="kbd">R</span>
  </button>
</div>
<div id="setMenu" class="menu" role="menu" aria-label="Настройки">
  <button class="mi" id="miOrtho" role="menuitemradio" aria-checked="false">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="m3 19 6-11 5 8 3-4 4 7Z"/><circle cx="17" cy="6.5" r="2"/></svg>
    Орто-подложка <svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12.5 5 5L20 6.5"/></svg>
  </button>
  <button class="mi on" id="miQgis" role="menuitemradio" aria-checked="true">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M3.5 9.5h17M3.5 15.5h17M9.5 3.5v17M15.5 3.5v17" opacity=".6"/></svg>
    Схема <svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12.5 5 5L20 6.5"/></svg>
  </button>
  <div class="msep"></div>
  <button class="mi" id="miAssetNone" role="menuitemradio" aria-checked="false">Без 3D-ресурса <svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12.5 5 5L20 6.5"/></svg></button>
  <button class="mi on" id="miAssetModel" role="menuitemradio" aria-checked="true"><span class="lbl">3D-модель</span> <svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12.5 5 5L20 6.5"/></svg></button>
  <button class="mi" id="miAssetSplat" role="menuitemradio" aria-checked="false"><span class="lbl">Gaussian Splatting</span> <svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12.5 5 5L20 6.5"/></svg></button>
  <div class="msep"></div>
  <button class="mi" id="miQLow" role="menuitemradio" aria-checked="false">Низкое качество <svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12.5 5 5L20 6.5"/></svg></button>
  <button class="mi on" id="miQMid" role="menuitemradio" aria-checked="true">Среднее качество <svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12.5 5 5L20 6.5"/></svg></button>
  <button class="mi" id="miQHigh" role="menuitemradio" aria-checked="false">Высокое качество <svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12.5 5 5L20 6.5"/></svg></button>
  <div class="msep"></div>
  <button class="mi" id="miDbg" role="switch" aria-checked="false">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 20a7 7 0 1 0 0-14 7 7 0 0 0 0 14Z"/><path d="M8.5 9.5 6 7M15.5 9.5 18 7M4 13h3M17 13h3M8.5 15.5 6 18M15.5 15.5 18 18M9 4.5 10.5 6M15 4.5 13.5 6"/></svg>
    Отладка <span class="sw" aria-hidden="true"></span>
  </button>
  <button class="mi" id="miTut">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.6 2.6 0 1 1 3.4 2.5c-.8.3-1 .8-1 1.6M12 16.8v.4"/></svg>
    Управление
  </button>
</div>
<div id="fabCol">
  <button class="fab" id="fabMode" data-tip="Режим вида" aria-label="Режим вида" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3 21 7.5 12 12 3 7.5 Z"/><path d="M3 12.5 12 17l9-4.5"/><path d="M3 17 12 21.5 21 17" opacity=".55"/>
    </svg>
  </button>
  <button class="fab" id="fabCam" data-tip="Камера" aria-label="Камера" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/>
      <path d="M12 3.5v5M12 15.5v5M3.5 12h5M15.5 12h5" opacity=".55"/>
    </svg>
  </button>
  <button class="fab" id="fabSet" data-tip="Настройки" aria-label="Настройки" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.03-4.3c.04-.3.07-.6.07-.9s-.03-.61-.07-.9l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65A.49.49 0 0 0 14 2h-4c-.24 0-.43.17-.47.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.22-.08-.49 0-.61.22l-2 3.46c.13.22-.07.49.12.64L4.6 10.3c-.04.29-.07.6-.07.9s.03.61.07.9l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.04.25.23.42.47.42h4c.24 0 .43-.17.47-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64z"/>

  </button>
</div>
